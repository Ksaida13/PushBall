<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Push the block</title>
    <!-- Telegram Web App API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      body {
        text-align: center;
        padding: 0;
        border: 0;
        margin: 0;
        overflow: hidden; /* Предотвращает скролл */
      }

      #loading-screen {
        position: fixed;
        width: 100%;
        height: 100%;
        background: #231F20;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }

/*       canvas {
        width: 720px;
        height: 1280px;
      /* Полноэкранный canvas */
      #unity-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw !important;
        height: 100vh !important;
        background: #231F20;
      } */
      }
    </style>
  </head>
  <body style="text-align: center; padding: 0; border: 0; margin: 0;">
  <body style="text-align: center; padding: 0; border: 0; margin: 0; overflow: hidden;">
      <!-- Loading Screen -->
      <div id="loading-screen">
        <img src="loading.gif" alt="Loading...">
      </div>

      <!-- Unity Canvas -->
    <canvas id="unity-canvas" width=1080 height=1920 style="width: 100%; height: 100%; background: #231F20"></canvas>
    <script src="Build/build0.loader.js"></script>
    <canvas id="unity-canvas" width=1080 height=1920></canvas>
    
    <script>
      // Инициализация Telegram Web App
      function initTelegram() {
        if (window.Telegram?.WebApp) {
          const tg = window.Telegram.WebApp;
          
          // Готовим приложение
          tg.ready();
          
          // Расширяем на максимальную высоту
          if (tg.expand) {
            tg.expand();
          }
          
          // Запрашиваем полноэкранный режим (Bot API 7.6+)
          setTimeout(() => {
            if (tg.requestFullscreen) {
              tg.requestFullscreen();
            }
          }, 500); // Небольшая задержка для стабильности
          
          // Отключаем вертикальные swipe-жесты
          if (tg.disableVerticalSwipes) {
            tg.disableVerticalSwipes();
          }
          
          console.log('Telegram Web App инициализирован');
        } else {
          console.log('Telegram Web App API недоступен');
        }
      }

      // Обработка мобильных устройств
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        // Создаем viewport meta для мобильных устройств
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes, viewport-fit=cover';
        document.getElementsByTagName('head')[0].appendChild(meta);

        // Настраиваем canvas для мобильных
        var canvas = document.querySelector("#unity-canvas");
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        canvas.style.width = "100vw";
        canvas.style.height = "100vh";
        canvas.style.position = "fixed";
        canvas.style.top = "0";
        canvas.style.left = "0";

        document.body.style.textAlign = "left";
      }

      // Инициализируем Telegram при загрузке
      document.addEventListener('DOMContentLoaded', function() {
        initTelegram();
      });

      // Также пробуем инициализировать сразу
      initTelegram();

      // Создание Unity экземпляра
      createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: "Build/build0.data",
        frameworkUrl: "Build/build0.framework.js",
        codeUrl: "Build/build0.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "GamePolygon",
        productName: "Push the block",
        productVersion: "0.1",
        // matchWebGLToCanvasSize: false, // Uncomment this to separately control WebGL canvas render size and DOM element size.
        // devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
      }).then(() => {
          // Hide loading screen when Unity loads
        matchWebGLToCanvasSize: true, // Включаем для корректного масштабирования
        // devicePixelRatio: 1, // Раскомментируйте для контроля DPI
      }).then((unityInstance) => {
          // Скрываем экран загрузки
          document.getElementById("loading-screen").style.display = "none";
          
          // Дополнительная попытка полноэкранного режима после загрузки Unity
          setTimeout(() => {
            if (window.Telegram?.WebApp?.requestFullscreen) {
              window.Telegram.WebApp.requestFullscreen();
            }
          }, 1000);
          
          console.log('Unity загружен успешно');
        }).catch((error) => {
          console.error('Ошибка загрузки Unity:', error);
        });

      // Предотвращаем случайное закрытие приложения
      window.addEventListener('beforeunload', function(e) {
        if (window.Telegram?.WebApp?.exitFullscreen) {
          window.Telegram.WebApp.exitFullscreen();
        }
      });

      // Блокируем контекстное меню на мобильных
      document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        return false;
      });

      // Предотвращаем зум на iOS
      document.addEventListener('touchstart', function(event) {
        if (event.touches.length > 1) {
          event.preventDefault();
        }
      }, { passive: false });

      let lastTouchEnd = 0;
      document.addEventListener('touchend', function(event) {
        const now = (new Date()).getTime();
        if (now - lastTouchEnd <= 300) {
          event.preventDefault();
        }
        lastTouchEnd = now;
      }, false);

    </script>
  </body>
</html>
