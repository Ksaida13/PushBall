<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Push the block</title>
    <!-- Telegram Web App API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      body {
        text-align: center;
        padding: 0;
        border: 0;
        margin: 0;
        overflow: hidden;
      }

      #loading-screen {
        position: fixed;
        width: 100%;
        height: 100%;
        background: #231F20;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }

      #unity-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw !important;
        height: 100vh !important;
        background: #231F20;
      }
    </style>
  </head>
  <body>
      <div id="loading-screen">
        <img src="loading.gif" alt="Loading...">
      </div>

      <canvas id="unity-canvas" width=1080 height=1920></canvas>
    
    <script src="Build/build0.loader.js"></script>
    <script>
      // Инициализация Telegram Web App
      function initTelegram() {
        try {
          if (window.Telegram && window.Telegram.WebApp) {
            const tg = window.Telegram.WebApp;
            
            tg.ready();
            
            if (tg.expand) {
              tg.expand();
            }
            
            setTimeout(() => {
              if (tg.requestFullscreen) {
                tg.requestFullscreen();
              }
            }, 500);
            
            if (tg.disableVerticalSwipes) {
              tg.disableVerticalSwipes();
            }
            
            console.log('Telegram Web App инициализирован');
          }
        } catch (error) {
          console.error('Ошибка инициализации Telegram:', error);
        }
      }

      // Настройки для мобильных устройств
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes, viewport-fit=cover';
        document.getElementsByTagName('head')[0].appendChild(meta);

        var canvas = document.querySelector("#unity-canvas");
        canvas.style.width = "100vw";
        canvas.style.height = "100vh";
        canvas.style.position = "fixed";
        canvas.style.top = "0";
        canvas.style.left = "0";

        document.body.style.textAlign = "left";
      }

      // Инициализация Telegram
      initTelegram();

      // Создание Unity экземпляра
      createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: "Build/build0.data",
        frameworkUrl: "Build/build0.framework.js",
        codeUrl: "Build/build0.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "GamePolygon",
        productName: "Push the block",
        productVersion: "0.1",
      }).then((unityInstance) => {
        // Скрываем экран загрузки
        document.getElementById("loading-screen").style.display = "none";
        
        // Дополнительная попытка полноэкранного режима
        setTimeout(() => {
          if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.requestFullscreen) {
            window.Telegram.WebApp.requestFullscreen();
          }
        }, 1000);
        
        console.log('Unity загружен успешно');
      }).catch((error) => {
        console.error('Ошибка загрузки Unity:', error);
        // Скрываем экран загрузки даже при ошибке
        document.getElementById("loading-screen").style.display = "none";
      });

    </script>
  </body>
</html>
