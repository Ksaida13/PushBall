<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Push the block</title>
    <!-- Telegram Web App API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            text-align: center;
            padding: 0;
            border: 0;
            margin: 0;
            overflow: hidden;
        }

        #loading-screen {
            position: fixed;
            width: 100%;
            height: 100%;
            background: #231F20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            color: white;
        }

        #unity-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw !important;
            height: 100vh !important;
            background: #231F20;
        }

        .loading-text {
            margin-top: 20px;
            font-family: Arial, sans-serif;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div id="loading-screen">
        <img src="loading.gif" alt="Loading...">
        <div class="loading-text">Проверка подписки...</div>
    </div>

    <canvas id="unity-canvas" width=1080 height=1920></canvas>

    <script src="Build/build0.loader.js"></script>
    <script>
        let tg;

        // Инициализация Telegram Web App
        function initTelegram() {
            try {
                if (window.Telegram && window.Telegram.WebApp) {
                    tg = window.Telegram.WebApp;
                    
                    tg.ready();
                    
                    if (tg.expand) {
                        tg.expand();
                    }
                    
                    if (tg.disableVerticalSwipes) {
                        tg.disableVerticalSwipes();
                    }
                    
                    console.log('Telegram Web App инициализирован');
                    return true;
                }
            } catch (error) {
                console.error('Ошибка инициализации Telegram:', error);
                return false;
            }
            return false;
        }

        // Проверка подписки через FlyerAPI
        async function checkFlyerSubscription() {
            try {
                if (!tg || !tg.initDataUnsafe || !tg.initDataUnsafe.user) {
                    console.error('Данные пользователя недоступны');
                    return false;
                }

                const userId = tg.initDataUnsafe.user.id;
                const languageCode = tg.initDataUnsafe.user.language_code || 'ru';

                console.log(`Проверка подписки пользователя: ${userId}`);

                const response = await fetch('https://api.flyerservice.io/check', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        key: "YOUR_FLYER_API_KEY", // Замените на ваш API ключ
                        user_id: userId,
                        language_code: languageCode
                    })
                });

                if (!response.ok) {
                    console.error(`HTTP error! status: ${response.status}`);
                    return false;
                }

                const result = await response.json();
                console.log('Результат проверки:', result);

                // Проверяем статус подписки согласно API документации
                return result.status === true;

            } catch (error) {
                console.error('Ошибка при проверке подписки:', error);
                return false;
            }
        }

        // Показ алерта и закрытие WebApp
        function showAlertAndClose(message) {
            if (tg && tg.showAlert) {
                tg.showAlert(message, () => {
                    console.log('Закрытие WebApp после алерта');
                    if (tg.close) {
                        tg.close();
                    }
                });
            } else {
                alert(message);
                if (tg && tg.close) {
                    tg.close();
                } else {
                    window.close();
                }
            }
        }

        // Загрузка Unity игры
        async function loadUnityGame() {
            try {
                console.log('Запуск Unity игры...');
                
                const unityInstance = await createUnityInstance(document.querySelector("#unity-canvas"), {
                    dataUrl: "Build/build0.data",
                    frameworkUrl: "Build/build0.framework.js",
                    codeUrl: "Build/build0.wasm",
                    streamingAssetsUrl: "StreamingAssets",
                    companyName: "GamePolygon",
                    productName: "Push the block",
                    productVersion: "0.1",
                });

                // Скрываем экран загрузки
                document.getElementById("loading-screen").style.display = "none";
                
                // Дополнительная попытка полноэкранного режима
                setTimeout(() => {
                    if (tg && tg.requestFullscreen) {
                        tg.requestFullscreen();
                    }
                }, 1000);
                
                console.log('Unity загружен успешно');
                
            } catch (error) {
                console.error('Ошибка загрузки Unity:', error);
                showAlertAndClose('Ошибка загрузки игры. Попробуйте позже.');
            }
        }

        // Главная функция инициализации
        async function initialize() {
            // Инициализируем Telegram
            if (!initTelegram()) {
                console.error('Не удалось инициализировать Telegram WebApp');
                showAlertAndClose('Ошибка инициализации. Откройте игру через Telegram.');
                return;
            }

            // Настройки для мобильных устройств
            if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
                var meta = document.createElement('meta');
                meta.name = 'viewport';
                meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes, viewport-fit=cover';
                document.getElementsByTagName('head')[0].appendChild(meta);

                var canvas = document.querySelector("#unity-canvas");
                canvas.style.width = "100vw";
                canvas.style.height = "100vh";
                canvas.style.position = "fixed";
                canvas.style.top = "0";
                canvas.style.left = "0";

                document.body.style.textAlign = "left";
            }

            // Небольшая задержка для полной инициализации Telegram
            await new Promise(resolve => setTimeout(resolve, 1000));

            // Проверяем подписку пользователя
            const hasValidSubscription = await checkFlyerSubscription();
            
            if (hasValidSubscription) {
                console.log('Подписка подтверждена, загружаем игру');
                await loadUnityGame();
            } else {
                console.log('Подписка не найдена или неактивна');
                showAlertAndClose('🔒 Для доступа к игре необходимо подписаться на наши каналы. Пожалуйста, оформите подписку и попробуйте снова.');
            }
        }

        // Запускаем инициализацию после загрузки страницы
        window.addEventListener('load', initialize);

    </script>
</body>
</html>
